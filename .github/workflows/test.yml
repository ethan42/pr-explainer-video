name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck skills/pr-explainer-video/scripts/pv.sh tests/test_layout.sh examples/powersort/verify/verify.sh
      - name: Python syntax
        run: python3 -m py_compile skills/pr-explainer-video/scripts/*.py skills/pr-explainer-video/references/example.py tests/*.py examples/powersort/*.py examples/powersort/verify/*.py

  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pull the manim image
        run: docker pull -q manimcommunity/manim:v0.22.0
      - name: Layout check, text dump and frame strip
        run: make test

  powersort-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute the powersort example's figures from CPython's own C code
        run: examples/powersort/verify/verify.sh
